<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Hostinger KVM 4 Malaysia Benchmark: AMD EPYC 9354P, 5.76 GB/s NVMe, 6ms Latency to Singapore">
  <defs>
    <linearGradient id="brandRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#75e7bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141d2a"/>
      <stop offset="100%" stop-color="#0b111a"/>
    </linearGradient>
    <pattern id="gridPattern" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e8eaf2" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#070b12"/>
  <rect width="1600" height="1000" fill="url(#gridPattern)"/>

  <!-- Subtle Radial Glow behind central chip -->
  <circle cx="800" cy="460" r="380" fill="#00e5ff" fill-opacity="0.06"/>
  <circle cx="800" cy="460" r="220" fill="#75e7bf" fill-opacity="0.05"/>

  <!-- Top Header within safe margin (y=112) -->
  <text x="120" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="28" letter-spacing="5" fill="#e8eaf2" fill-opacity="0.6" font-weight="700">HOSTINGER KVM 4 VPS BENCHMARK</text>
  <rect x="120" y="136" width="410" height="4" rx="2" fill="url(#brandRule)"/>
  <text x="1480" y="112" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="22" letter-spacing="3" fill="#00e5ff" font-weight="600">MALAYSIA // AS47583</text>

  <!-- Circuit Links between Center and Left/Right Pods -->
  <g stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M700 460 L540 460"/>
    <path d="M900 460 L1060 460"/>
    <path d="M800 560 L800 660"/>
    <circle cx="620" cy="460" r="4" fill="#00e5ff"/>
    <circle cx="980" cy="460" r="4" fill="#75e7bf"/>
  </g>

  <!-- Central Server Die: AMD EPYC 9354P -->
  <g transform="translate(800, 460)">
    <!-- Rotating telemetry rings -->
    <circle r="140" fill="none" stroke="#e8eaf2" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="12 8"/>
    <circle r="115" fill="none" stroke="#75e7bf" stroke-opacity="0.2" stroke-width="1.5"/>
    
    <!-- Chip square -->
    <rect x="-90" y="-90" width="180" height="180" rx="20" fill="#141d2a" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="#0d1520" stroke="#75e7bf" stroke-opacity="0.2"/>
    
    <path d="M-55 -25 h110 M-55 5 h110 M-55 35 h110" stroke="#e8eaf2" stroke-opacity="0.1" stroke-width="1.5"/>
    <circle r="18" fill="#00e5ff" fill-opacity="0.2"/>
    
    <text y="-8" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" letter-spacing="2" fill="#00e5ff" font-weight="800">EPYC</text>
    <text y="18" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1" fill="#75e7bf" font-weight="700">ZEN 4</text>
    
    <!-- Corner status pins -->
    <circle cx="-62" cy="-62" r="4" fill="#00e5ff"/>
    <circle cx="62" cy="-62" r="4" fill="#75e7bf"/>
    <circle cx="-62" cy="62" r="4" fill="#75e7bf"/>
    <circle cx="62" cy="62" r="4" fill="#00e5ff"/>
  </g>

  <!-- Left Pod: NVMe Storage IOPS & Throughput -->
  <g transform="translate(120, 250)">
    <rect width="420" height="380" rx="18" fill="url(#cardGradDark)" stroke="#e8eaf2" stroke-opacity="0.1"/>
    
    <text x="36" y="52" font-family="ui-monospace,monospace" font-size="18" letter-spacing="3" fill="#e8eaf2" fill-opacity="0.5">STORAGE THROUGHPUT</text>
    
    <text x="36" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="900" fill="#ffffff">5.76 <tspan font-size="28" fill="#00e5ff">GB/s</tspan></text>
    
    <rect x="36" y="132" width="200" height="32" rx="6" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="50" y="154" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#00e5ff">114,100 4K IOPS</text>
    
    <!-- fio bars -->
    <g transform="translate(36, 195)">
      <text y="12" font-family="ui-monospace,monospace" font-size="14" fill="#e8eaf2" fill-opacity="0.6">4K Mixed (467.5 MB/s)</text>
      <rect y="20" width="348" height="8" rx="4" fill="#1b2535"/>
      <rect y="20" width="110" height="8" rx="4" fill="#00e5ff"/>

      <text y="58" font-family="ui-monospace,monospace" font-size="14" fill="#e8eaf2" fill-opacity="0.6">64K Mixed (5.67 GB/s)</text>
      <rect y="66" width="348" height="8" rx="4" fill="#1b2535"/>
      <rect y="66" width="320" height="8" rx="4" fill="#75e7bf"/>

      <text y="104" font-family="ui-monospace,monospace" font-size="14" fill="#e8eaf2" fill-opacity="0.6">512K Mixed (5.76 GB/s)</text>
      <rect y="112" width="348" height="8" rx="4" fill="#1b2535"/>
      <rect y="112" width="335" height="8" rx="4" fill="#00e5ff"/>

      <text y="150" font-family="ui-monospace,monospace" font-size="14" fill="#e8eaf2" fill-opacity="0.6">1M Mixed (5.65 GB/s)</text>
      <rect y="158" width="348" height="8" rx="4" fill="#1b2535"/>
      <rect y="158" width="325" height="8" rx="4" fill="#75e7bf"/>
    </g>
  </g>

  <!-- Right Pod: Singapore Direct Peering -->
  <g transform="translate(1060, 250)">
    <rect width="420" height="380" rx="18" fill="url(#cardGradDark)" stroke="#e8eaf2" stroke-opacity="0.1"/>
    
    <text x="36" y="52" font-family="ui-monospace,monospace" font-size="18" letter-spacing="3" fill="#e8eaf2" fill-opacity="0.5">REGIONAL PEERING</text>
    
    <text x="36" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="900" fill="#75e7bf">6.08 <tspan font-size="28" fill="#00e5ff">ms</tspan></text>
    
    <rect x="36" y="132" width="240" height="32" rx="6" fill="#75e7bf" fill-opacity="0.15" stroke="#75e7bf" stroke-opacity="0.4"/>
    <text x="50" y="154" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#75e7bf">SINGAPORE LEASEWEB 10G</text>
    
    <!-- Network details -->
    <g transform="translate(36, 195)" font-family="ui-monospace,monospace" font-size="15">
      <rect width="348" height="38" rx="6" fill="#131c28"/>
      <text x="16" y="24" fill="#e8eaf2" fill-opacity="0.6">IPv4 Speed:</text>
      <text x="332" y="24" text-anchor="end" fill="#00e5ff" font-weight="700">1.01 Gbps / 974 Mbps</text>

      <rect y="48" width="348" height="38" rx="6" fill="#131c28"/>
      <text x="16" y="72" fill="#e8eaf2" fill-opacity="0.6">IPv6 Speed:</text>
      <text x="332" y="72" text-anchor="end" fill="#75e7bf" font-weight="700">996 Mbps / 945 Mbps</text>

      <rect y="96" width="348" height="38" rx="6" fill="#131c28"/>
      <text x="16" y="120" fill="#e8eaf2" fill-opacity="0.6">Memory Speed:</text>
      <text x="332" y="120" text-anchor="end" fill="#c084fc" font-weight="700">21,725 MiB/s</text>

      <rect y="144" width="348" height="38" rx="6" fill="#131c28"/>
      <text x="16" y="168" fill="#e8eaf2" fill-opacity="0.6">Geekbench 6:</text>
      <text x="332" y="168" text-anchor="end" fill="#ffffff" font-weight="700">1,451 / 4,468</text>
    </g>
  </g>

  <!-- Bottom Center Bar: CPU Steal & Stability (mpstat 60s) -->
  <g transform="translate(560, 660)">
    <rect width="480" height="150" rx="16" fill="url(#cardGradDark)" stroke="#e8eaf2" stroke-opacity="0.1"/>
    
    <text x="30" y="38" font-family="ui-monospace,monospace" font-size="16" letter-spacing="3" fill="#e8eaf2" fill-opacity="0.5">CPU STEAL (MPSTAT 60s SUSTAINED LOAD)</text>
    
    <text x="30" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900" fill="#75e7bf">2.05% <tspan font-size="18" fill="#e8eaf2" fill-opacity="0.6">STEAL</tspan></text>
    
    <text x="260" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900" fill="#00e5ff">0.00% <tspan font-size="18" fill="#e8eaf2" fill-opacity="0.6">I/O WAIT</tspan></text>
    
    <text x="30" y="126" font-family="ui-monospace,monospace" font-size="13" fill="#e8eaf2" fill-opacity="0.5">4 vCPUs @ 3.25GHz · 93.10% DEDICATED CAPACITY · ZERO STARVATION</text>
  </g>

  <!-- Safe Footer (y=920) -->
  <text x="120" y="920" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="20" letter-spacing="3" fill="#e8eaf2" fill-opacity="0.4">4 vCPUs ZEN 4 · 16 GB DDR5 · 200 GB NVME VPS</text>
  <text x="1480" y="920" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="20" letter-spacing="3" fill="#00e5ff" font-weight="600">6.08MS PING TO SINGAPORE</text>
</svg>